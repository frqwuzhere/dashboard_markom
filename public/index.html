<!DOCTYPE html>
<html lang="id" data-theme="ocean" data-mode="light" data-side="right">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b7bd8">
<title>Dashboard Markom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="loader hide" id="loader"><div class="spin"></div></div>

<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lkT">
  <div class="lk-card" id="lkCard">
    <div class="lk-logo" id="lkLogo"></div>
    <h2 id="lkT">Teman Baik Markom</h2>
    <p>Masukkan kode akses untuk membuka aplikasi</p>
    <div class="lk-f"><span id="lkIc"></span><input id="lkIn" type="password" autocomplete="current-password" placeholder="Kode akses" aria-label="Kode akses" onkeydown="if(event.key==='Enter')tryUnlock()"><button type="button" class="lk-eye" id="lkEye" onclick="lkEye()" aria-label="Tampilkan kode"></button></div>
    <div class="lk-err" id="lkErr" role="alert"></div>
    <label class="lk-rm"><input type="checkbox" id="lkRm" checked> Ingat di perangkat ini</label>
    <button type="button" class="lk-go" id="lkGo" onclick="tryUnlock()">Masuk <span id="lkArr"></span></button>
  </div>
</div>

<div class="app nav-collapsed" id="app">
  <aside class="rail">
    <div class="mark"><button class="logo" id="navExpandBtn" onclick="toggleNav()" aria-label="Toggle sidebar" title="Toggle sidebar">CP</button><div><b id="appName">Content Planner</b><small id="ownerLbl">Plan • Create • Publish</small></div><button class="nav-collapse" id="navCollapseBtn" onclick="toggleNav()" aria-label="Perkecil sidebar" title="Perkecil sidebar"></button></div>
    <nav id="rnav"></nav>
    <div class="promo"><span class="pi" id="icPromo"></span><b>Export ke Sheet</b><p>Kirim jadwal &amp; performa konten ke Google Sheet.</p><button onclick="openExport()">Export</button></div>
    <div class="nw" id="notesW"></div>
    <div class="prof"><button class="acc-btn" id="accBtn" onclick="openAccMenu(this)"></button><button class="ib bare gearb" id="lockBtn" onclick="lockNow()" title="Kunci aplikasi" aria-label="Kunci aplikasi"></button><button class="ib bare gearb" id="setNav" onclick="go('settings')" title="Pengaturan" aria-label="Pengaturan"></button></div>
  </aside>

  <main class="main">
    <header class="head">
      <button class="ib bare mob" id="accBtnM" onclick="openAccMenu()" aria-label="Ganti akun"></button>
      <div class="ttl"><h1 id="tTitle"></h1><div class="sub" id="tSub"></div></div>
      <button class="ib mob" id="modeBtnM" onclick="toggleMode()" aria-label="Ganti mode"></button>
      <label class="search hsearch desk"><span id="icSrch"></span><input id="hq" placeholder="Cari konten…" onkeydown="hSearch(event)"></label>
      <span class="hsp"></span>
      <div class="chips desk" id="hchips"></div>
      <button class="ib" id="bellBtn" onclick="goOverdue()" aria-label="Konten terlambat" title="Konten terlambat"></button>
      <button class="ib desk" id="modeBtn" onclick="toggleMode()" aria-label="Ganti mode terang/gelap"></button>
      <button class="ib" id="refBtn" onclick="reload()" aria-label="Muat ulang data" title="Muat ulang"></button>
      <button class="ib desk" id="expBtnD" onclick="openExport()" aria-label="Export ke Sheet" title="Export ke Sheet"></button>
      <button class="btn pri desk newb" onclick="newContent()" title="Konten baru (N)"><span id="icNew"></span>Konten baru</button>
      <button class="ib mob" id="expBtnM" onclick="openExport()" aria-label="Export ke Sheet"></button>
    </header>
    <div id="demoBox"></div>
    <section class="body" id="view"></section>
  </main>
</div>

<nav class="bnav" id="bnav"></nav>
<button class="fab" id="fab" onclick="toggleQuick(event)" aria-label="Aksi cepat"></button>
<div class="pop" id="pop"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="/js/app.js" defer></script>
</body>
</html>
